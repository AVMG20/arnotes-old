; Taskmanager under workbench: its database, the server, and the watcher that deploys master.
; Hand-written, so workbench leaves it alone (it only rewrites *.generated.conf).
; Installed as /opt/workbench/data/etc/supervisord.d/taskmanager.conf by deploy/workbench/install.sh.

[program:taskmanager-postgres]
command=/opt/workbench/data/var/lib/taskmanager/bin/run-postgres.sh
priority=100
stopsignal=INT
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/opt/workbench/data/var/log/taskmanager-postgres.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:taskmanager]
command=/opt/workbench/data/var/lib/taskmanager/bin/run-server.sh
priority=200
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/opt/workbench/data/var/log/taskmanager.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:taskmanager-updater]
command=/opt/workbench/data/var/lib/taskmanager/bin/update.sh --watch
priority=300
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/opt/workbench/data/var/log/taskmanager-updater.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
