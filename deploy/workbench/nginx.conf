# Taskmanager at http://taskmanager.localhost, proxied to the server on 127.0.0.1:3100.
# Hand-written, so workbench leaves it alone (it only rewrites *.generated.conf).
# Installed as /opt/workbench/data/etc/nginx/sites/taskmanager.conf by deploy/workbench/install.sh.

map $http_upgrade $taskmanager_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name taskmanager.localhost;

    # nginx listens on every interface; this instance is for this machine only
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # task images are capped at 10 MB by the app
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the crew API reads a forwarding header as a remote caller: provisioning goes to 127.0.0.1:3100 direct
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # live updates (/_ws) and the agent event stream stay open
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $taskmanager_connection;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
}
