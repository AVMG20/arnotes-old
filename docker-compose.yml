name: arnotes

services:
  app:
    build:
      context: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://arnotes:arnotes@postgres:5432/arnotes}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      ALLOW_SIGN_UP: ${ALLOW_SIGN_UP:-true}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      GITHUB_ALLOWED_OWNERS: ${GITHUB_ALLOWED_OWNERS:-}
      # The GitHub delivery queue (used from GH6b on). Built from the broker's variables below: there is no default password.
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://${RABBITMQ_USER:-arnotes}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/${RABBITMQ_VHOST:-arnotes}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      NUXT_PUBLIC_ALLOW_SIGN_UP: ${ALLOW_SIGN_UP:-true}
      NUXT_PUBLIC_DISCORD_ENABLED: ${NUXT_PUBLIC_DISCORD_ENABLED:-false}
      NUXT_PUBLIC_GITHUB_ENABLED: ${NUXT_PUBLIC_GITHUB_ENABLED:-false}
      NUXT_PUBLIC_GOOGLE_ENABLED: ${NUXT_PUBLIC_GOOGLE_ENABLED:-false}
      NUXT_PUBLIC_OIDC_ENABLED: ${NUXT_PUBLIC_OIDC_ENABLED:-false}
      NUXT_PUBLIC_OIDC_NAME: ${NUXT_PUBLIC_OIDC_NAME:-Single sign-on}
      NUXT_PUBLIC_EMAIL_CODE_ENABLED: ${NUXT_PUBLIC_EMAIL_CODE_ENABLED:-false}
      NUXT_PUBLIC_PASSKEYS_ENABLED: ${NUXT_PUBLIC_PASSKEYS_ENABLED:-true}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - app_data:/app/data
    depends_on:
      db-setup:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  db-setup:
    build:
      context: .
      target: database
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://arnotes:arnotes@postgres:5432/arnotes}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arnotes
      POSTGRES_USER: arnotes
      POSTGRES_PASSWORD: arnotes
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arnotes -d arnotes"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # The queue of GitHub deliveries (the webhook uses it from GH6b; until then the app does not connect). The password is required (RABBITMQ_PASSWORD in .env); the broker is published on
  # 127.0.0.1 only, and its management UI is not published at all (use the broker's own tools inside the container).
  rabbitmq:
    image: rabbitmq:4.3.1-management-alpine@sha256:b84c252f54ecd61522320135c2bfe19a8db3e49e8dd559737817e8429e84cb7e
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-arnotes}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-arnotes}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  app_data:
  postgres_data:
  rabbitmq_data:
